extends:
  - 'spectral:oas'
  - 'spectral:asyncapi'
  - 'spectral:arazzo'
  - 'spectral-aws-apigateway-ruleset'

overrides:

  - files:
      - 'tf/openapi/spec.yaml'
    rules:
      # Disabling these rules for OPTIONS methods
      operation-description:
        given: "$.paths[*].options"
        then:
          function: truthy
        severity: off
      operation-tags:
        given: "$.paths[*].options"
        then:
          function: truthy
        severity: off
      operation-operationId:
        given: "$.paths[*].options"
        then:
          function: truthy
        severity: off
