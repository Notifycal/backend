components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: uuid
        idp:
          type: string
        idpId:
          type: string
        lastSignInAt:
          $ref: '#/components/schemas/UnixTimestamp'
        signedUpAt:
          $ref: '#/components/schemas/UnixTimestamp'
        userStatus:
          type: string
          enum:
            - live
            - onboarding
            - banned
        config:
          $ref: '#/components/schemas/ReminderConfig'
      required:
        - userId
        - email
        - idp
        - idpId
        - lastSignInAt
        - signedUpAt
        - userStatus
      additionalProperties: false

    Calendar:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false

    CalendarList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
      additionalProperties: false

    CalendarListWithTemplateSelection:
      type: object
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Calendar'
              - type: object
                properties:
                  template:
                    $ref: '#/components/schemas/Template'
      additionalProperties: false

    Business:
      type: object
      properties:
        name:
          description: Business name
          type: string
        address:
          description: Business address
          type: string
      required:
        - name
        - address
      additionalProperties: false

    BusinessWithContact:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          properties:
            senderContact:
              $ref: '#/components/schemas/SenderContact'
          required:
            - senderContact
          additionalProperties: false

    ReminderConfig:
      type: object
      description: Data containing user choice to send reminder
      properties:
        business:
          $ref: '#/components/schemas/BusinessWithContact'
        calendars:
          $ref: '#/components/schemas/CalendarListWithTemplateSelection'

    SenderContact:
      type: object
      oneOf:
        - $ref: '#/components/schemas/RCSSender'
        - $ref: '#/components/schemas/Phone'

    ReceiverContact:
      $ref: '#/components/schemas/Phone'

    PhoneNumber:
      type: string
      description: A phone number string. No dial codes or special characters
      example: '5551234567'

    CountryCode:
      type: string
      description: A country code in ISO 3166-1 alpha-2 format
      example: 'ES'

    NotifycalRCSSenderId:
      type: string
      description: A RCS sender identifier
      example: 'My Business'

    Phone:
      type: object
      required:
        - type
        - countryCode
        - phoneNumber
      properties:
        type:
          type: string
          enum: [phone]
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
      additionalProperties: false

    RCSSender:
      type: object
      required:
        - type
        - identifier
      properties:
        type:
          type: string
          enum: [rcs]
        identifier:
          $ref: '#/components/schemas/NotifycalRCSSenderId'
      additionalProperties: false

    Sender:
      oneOf:
        - $ref: '#/components/schemas/RCSSender'
        - $ref: '#/components/schemas/Phone'

    Template:
      type: object
      required:
        - id
        - language
      properties:
        id:
          type: string
          description: Template ID based on Notifycal offer.
          example: 'formal-en-01'
        language:
          $ref: '#/components/schemas/LanguageCode'
      additionalProperties: false

    UnixTimestamp:
      type: number
      format: int64
      description: Unix timestamp in seconds

    DateTime:
      type: object
      properties:
        dateTime:
          type: string
          format: date-time
          description: Date and time in ISO 8601 format.
          example: '2023-10-01T12:00:00Z'
        timeZone:
          type: string
          description: Time zone of the reminder. IANA format.
          example: 'Europe/Madrid'

    LanguageCode:
      type: string
      description: A language code in ISO 639-1 format
      example: 'es'
      enum:
        - en
        - es

    Tier:
      type: string
      description: user's choice for monthly subscription plan
      enum:
        - good
        - better
        - best

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          # This will limit us in case we want to send dynamic/custom error messages. But it's ok for now
          enum:
            - Bad Request
            - Unauthorised
            - Not Found
            - Conflict
            - Forbidden
            - KO
      required:
        - message
      additionalProperties: false

  responses:
    AuthenticationOK:
      description: OK
      content:
        application/json:
          schema:
            type: object
            description: Response payload containing authorization
            properties:
              accessToken:
                description: jwt to use as an authorization against all system APIs. It contains the following claims userId, email, idp and idpId
                type: string
              tokenType:
                type: string
                enum:
                  - Bearer
              refreshToken:
                description: jwt to refresh authorization for system APIs
                type: string
            required:
              - accessToken
              - tokenType
              - refreshToken

    UserProfile:
      description: 'OK'
      content:
        application/json:
          schema:
            type: object
            properties:
              result: { $ref: '#/components/schemas/User' }
            required: [result]
            additionalProperties: false

    UserIdpCalendars:
      description: 'OK'
      content:
        application/json:
          schema:
            type: object
            properties:
              result: { $ref: '#/components/schemas/CalendarList' }
            required: [result]
            additionalProperties: false

    PaymentSessionResult:
      description: 'OK'
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  url:
                    type: string
                    format: url
                    description: The returned checkout session URL by payment provider. Either a success redirect URL or a cancel URL.
                required:
                  - url
                additionalProperties: false
            required:
              - result
            additionalProperties: false

    CustomerPortalSessionResult:
      description: 'OK'
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: object
                properties:
                  url:
                    type: string
                    format: url
                    description: The returned customer portal session URL by payment provider.
                required:
                  - url
                additionalProperties: false
            required:
              - result
            additionalProperties: false

    Response200:
      description: 'OK'

    Response202:
      description: 'Accepted'

    Response204:
      description: 'No Content'

    BadRequest:
      description: Bad Request response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    Unauthorised:
      description: Unauthorised response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    Forbidden:
      description: Forbidden response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    NotFound:
      description: NotFound response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    Conflict:
      description: Conflict response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    InternalServerError:
      description: Internal Server Error response payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    CORSResponse:
      description: CORS Preflight Response
      headers:
        Access-Control-Allow-Origin:
          schema:
            type: string
        Access-Control-Allow-Methods:
          schema:
            type: string
        Access-Control-Allow-Headers:
          schema:
            type: string
        Access-Control-Max-Age:
          schema:
            type: integer
            example: 86400
