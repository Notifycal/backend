---
openapi: '3.1.1'
info:
  title: 'Notifycal Api'
  version: 0
servers:
  - url: https://privatearea{environment}.notifycal.com/api/{api_version}
    variables:
      environment:
        enum:
          - ''      # Production
          - .qa     # QA server
          - .dev    # Development
      api_version:
        enum:
          - v1
paths:
  /login:
    post:
      summary: Login endpoint
      request:
        content:
          application/json:
            schema:
              type: object
              description: Request payload containing google code provided by Google to the user on successful oauth logon
              properties:
                google-code:
                  description: code to verify against Google to check that user is who they claim they are
                  type: string
      security: [] # This overrides global definition since this endpoint is unprotected
      responses:
        200:
          description: 'OK'
          content:
            application/json:
              schema:
                type: object
                description: Response payload containing authorization
                properties:
                  accessToken:
                    description: jwt to use as an authorization against all APIs 
                    type: string
                  tokenType:
                    type: enum
                    enum:
                      - Bearer
                  refreshToken:
                    type: enum
                    enum:
                      - WIP
        400:
          description: 'Bad Request'
          content:
            text/html:
              schema:
                type: string
                enum:
                  - Bad Request
        401:
          description: 'Unauthorized'
          content:
            text/html:
              schema:
                type: string
                enum:
                  - Unauthorized
        500:
          description: 'Internal Server Error'
          content:
            text/html:
              schema:
                type: string
                enum:
                  - Internal Server Error
      x-amazon-apigateway-integration:
        uri: 'arn:aws:apigateway:${aws_region}:lambda:path/2015-03-31/functions/${lambda_functions.login_arn}/invocations'
        responses:
          default:
            statusCode: '200'
        passthroughBehavior: 'when_no_match'
        httpMethod: 'POST'
        type: 'aws_proxy'
  /watch_me:
    post:
      summary: Receive GCal watch endpoint data
      responses:
        200:
          description: 'OK'
          content: {}
        500:
          description: 'Internal Server Error'
          content: {}
      x-amazon-apigateway-integration:
        uri: 'arn:aws:apigateway:${aws_region}:lambda:path/2015-03-31/functions/${lambda_functions.post_watch_events_arn}/invocations'
        responses:
          default:
            statusCode: '200'
        passthroughBehavior: 'when_no_match'
        httpMethod: 'POST'
        type: 'aws_proxy'

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes
