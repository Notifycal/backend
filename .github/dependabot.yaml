version: 2
updates:
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to
    # specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: '/'
    schedule:
      interval: 'weekly'
    registries:
      - notifycal-github

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-lambda-powertools:
        patterns:
          - '@aws-lambda-powertools/*'
    registries:
      - npm-github-registry

  - package-ecosystem: 'terraform'
    directories:
      - '/tf'
      - '/tf/**'
    schedule:
      interval: 'weekly'
    registries:
      - notifycal-github

registries:
  npm-github-registry:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_PAT}}

  notifycal-github:
    type: git
    url: 'https://github.com'
    username: x-access-token
    password: ${{secrets.DEPENDABOT_PAT}}
