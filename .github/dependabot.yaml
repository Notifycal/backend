version: 2
updates:
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to
    # specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'

  - package-ecosystem: 'terraform'
    directory: '/tf'
    schedule:
      interval: 'weekly'
