name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md' # This is what release-please changes in the release PRs

concurrency:
  # github.head_ref is only set when the workflow was triggered by a
  # pull_request and it contains the value of the source branch of the PR.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    # Set job outputs to values from filter step
    outputs:
      infra: ${{ steps.filter.outputs.tf }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Validate commits with commitlint
        uses: wagoid/commitlint-github-action@v6
        id: commitlint
        with:
          configFile: .commitlintrc.json
      - uses: dorny/paths-filter@v3
        # Skip the filter if there is no PR to filter
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            tf:
              - 'tf/**'
              - '.github/workflows/cd.yaml'
            backend:
              - '**'
              - '!tf/**'
              - '!README.md'
              - '.github/workflows/cd.yaml'

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: read
    needs: preflight
    if: |
      needs.preflight.outputs.backend == 'true' || github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Generate .npmrc
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{secrets.GITHUB_TOKEN}}" > .npmrc
          echo "@notifycal=https://npm.pkg.github.com/" >> .npmrc
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint files
        id: lint
        run: npm run lint
        continue-on-error: true
      - name: Check formatting
        id: format
        run: npm run prettier
        continue-on-error: true
      - name: Typescript types
        id: types
        run: npm run types
        continue-on-error: true
      - name: Tests
        id: tests
        run: npm run test
        continue-on-error: true
      # Testing would go here, but maybe not on PR checks (time and money)
      - run: npm run build && npm run package
        id: build
        continue-on-error: true
      - name: Pass or fail?
        # Check previous step outcomes (only if the step has an id)
        run: |
          if [[ ${{ contains(steps.*.outcome, 'failure') }} == "true" ]]; then
            exit 1;
          else
            exit 0;
          fi
      - uses: actions/upload-artifact@v4
        # Only produces artifacts when running on push or manually
        if: github.event_name != 'pull_request'
        with:
          name: build
          path: dist/build.zip

  tofu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    needs: preflight
    # Runs if there are changes to the infra (PR) or the event isn't PR
    if: |
      needs.preflight.outputs.infra == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Get GH token from Github App
        id: gh-app-auth
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.NOTIFYCAL_CICD_APP_ID }}
          private_key: ${{ secrets.NOTIFYCAL_CICD_APP_SECRET }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.gh-app-auth.outputs.token }}

      - name: Hack for github internal repo access :(
        run: git config --global url."https://foo:${{ steps.gh-app-auth.outputs.token }}@github.com".insteadOf ssh://git@github.com

      # Using this to avoid unnecessary runs when files have not changed
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tf: 
              - 'tf/*.tf'
              - 'tf/modules/**/*.tf'
              - '!CHANGELOG.md'
            'tf/modules/api_gateway_external_domain':
              - 'tf/modules/api_gateway_external_domain/**'
              - '!tf/modules/api_gateway_external_domain/README.md'
            'tf/modules/sqs':
              - 'tf/modules/sqs/**'
              - '!tf/modules/sqs/README.md'
            'tf/modules/sns':
              - 'tf/modules/sns/**'
              - '!tf/modules/sns/README.md'

      - name: Get tofu version from .opentofu-version
        run: echo "tofu_version=$(cat .opentofu-version)" >> "${GITHUB_OUTPUT}"
        id: get_tofu_version
        working-directory: tf

      - name: Cached tofu binary?
        id: tofu-binary-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/tofu
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}
        env:
          TOFU_VERSION: ${{ steps.get_tofu_version.outputs.tofu_version }}

      - name: Install OpenTofu
        # Only if there is no cache
        if: steps.tofu-binary-cache.outputs.cache-hit != 'true'
        run: |
          DOWNLOAD_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          TEMP_DIR=$(mktemp -d)

          curl -sL "${DOWNLOAD_URL}" -o "${TEMP_DIR}/tofu.tar.gz"
          tar -zxf "${TEMP_DIR}/tofu.tar.gz" -C "${TEMP_DIR}"

          chmod +x "${TEMP_DIR}/tofu"
          sudo mv "${TEMP_DIR}/tofu" /usr/local/bin

          rm -rf "${TEMP_DIR}"

          tofu --version
        env:
          TOFU_VERSION: ${{ steps.get_tofu_version.outputs.tofu_version }}

      - name: TF init and validate
        run: |
          CHANGED_MODULES=$(echo '${{ steps.filter.outputs.changes }}' | jq -r '.[]')

          for dir in ${CHANGED_MODULES}; do
            pushd "${dir}" > /dev/null || exit
            echo
            echo "Running init and validate against: $(pwd)"
            tofu init && tofu validate
            popd > /dev/null || exit
          done

      - run: tofu fmt -recursive
        if: github.event_name == 'pull_request'
        working-directory: tf

      - id: has_submodules
        run: |
          if [[ -d "modules/" ]]; then
            echo "RECURSIVE=true" >> "${GITHUB_ENV}"
            echo "RECURSIVE_PATH=modules" >> "${GITHUB_ENV}"
          else
            echo "RECURSIVE=false" >> "${GITHUB_ENV}"
            echo "RECURSIVE_PATH=" >> "${GITHUB_ENV}"
          fi

      - name: Render OpenTofu docs
        if: github.event_name == 'pull_request'
        uses: terraform-docs/gh-actions@v1
        with:
          output-method: inject
          config-file: .terraform-docs.yaml
          working-dir: tf

      - name: tofu clean
        run: rm -rf .terraform/ .terraform.lock.hcl
        working-directory: tf

      - name: Fix .git owner
        if: github.event_name == 'pull_request'
        run: sudo chown runner:docker -R .git
        # https://github.com/terraform-docs/gh-actions/issues/90

      - name: 'Push to ${{ github.head_ref || github.ref_name }}'
        if: github.event_name == 'pull_request'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .

          # Check if there are any staged changes before committing
          if git diff --cached --quiet; then
            echo "git_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No changes to commit."
          else
            echo "git_changes=true" >> "${GITHUB_OUTPUT}"
            git commit -m "ci(auto): generate docs and format"
            git push
          fi

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - tofu
    # environment: prod
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: artifact/

      - name: Display structure of downloaded files
        run: ls -R

      - id: release-please
        if: github.event_name != 'pull_request'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Upload node artifact to release
        if: ${{ steps.release-please.outputs.release_created }}
        run: |
          gh release upload ${{ steps.release-please.outputs.tag_name }} artifact/build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
